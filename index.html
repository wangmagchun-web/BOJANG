<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 보장 검색</title>
<meta name="robots" content="noindex"><meta property="og:title" content="내 보장 검색"><meta property="og:description" content="병명이나 상황을 검색하면 받을 수 있는 보험금이 나와요">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&amp;family=Outfit:wght@200;300;400&amp;display=swap">
<style>:root{--bg:#fff;--wash:#F7F6F4;--ink:#26252B;--mute:#6A6972;--faint:#9B9AA3;--line:#E7E6EA;--pt:#C4164F;--a:#C4164F;--a-txt:#B0123F;--c:#C9962B;--c-txt:#7F5C0C;--nu:'Outfit','Noto Sans KR',sans-serif;--ko:'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.7 var(--ko);word-break:keep-all;overflow-wrap:break-word;overflow-x:hidden}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
button,input{font-family:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left,0px))}
/* 고객 화면 */
.find{padding:clamp(40px,8vw,96px) 0 clamp(36px,6vw,70px)}
.who{margin:0 0 12px;color:var(--mute);font-size:1.05rem}
.find h1{margin:0;font:300 clamp(2.3rem,6.4vw,4.4rem)/1.15 var(--ko);letter-spacing:-.02em;text-wrap:balance}
.findsub{margin:14px 0 0;color:var(--mute);font-size:1.1rem;font-weight:300}
.findbox{position:relative;margin-top:clamp(26px,5vw,44px);border-bottom:2px solid var(--ink)}
.findbox:focus-within{border-bottom-color:var(--pt)}
#find{width:100%;border:0;outline:0;background:transparent;font:300 clamp(1.6rem,4vw,2.6rem)/1.3 var(--ko);color:var(--ink);padding:10px 56px 12px 0;-webkit-appearance:none;appearance:none}
#find::placeholder{color:#B9B8BF}#find::-webkit-search-cancel-button{display:none}
#findx{position:absolute;right:0;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;background:none;font:200 2.2rem/1 var(--nu);color:var(--mute);cursor:pointer}
.chips0{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips0 button{font:400 1rem/1.2 var(--ko);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:9px 16px;min-height:44px;cursor:pointer}
.chips0 button:hover{border-color:var(--ink)}
.chips0 button.all{color:var(--mute);border-style:dashed}
#found{margin-top:clamp(20px,4vw,34px)}
.prem0{margin:clamp(30px,5vw,50px) 0 0;color:var(--mute);font-size:.98rem}
.prem0 b{font:300 1.15rem/1 var(--nu);color:var(--ink)}
.hit{border-top:1px solid var(--line)}.hit:last-of-type{border-bottom:1px solid var(--line)}
.hitrow{display:flex;width:100%;align-items:center;gap:14px;background:none;border:0;padding:15px 0;cursor:pointer;text-align:left;font:300 1.3rem/1.35 var(--ko);color:var(--ink);min-height:60px}
.hitrow .nm{flex:1;min-width:0}
.hitrow .am{font:300 1.5rem/1 var(--nu);color:var(--pt);white-space:nowrap}
.hitrow .am.zero{font:300 1rem/1 var(--ko);color:var(--faint)}
.hitrow::after{content:"+";font:200 1.7rem/1 var(--nu);color:var(--mute);width:20px;text-align:center}
.hit.on .hitrow::after{content:"\2212"}
.res{padding:2px 0 30px}
.sw{display:inline-flex;gap:4px;margin-bottom:6px}
.sw button{font:400 .92rem/1.2 var(--ko);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 15px;min-height:42px;cursor:pointer}
.sw button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tt{font:200 clamp(3rem,8vw,5.4rem)/1.08 var(--nu);letter-spacing:-.025em;color:var(--pt);margin:6px 0 2px}
.kk{color:var(--mute);font-size:1rem}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,3vw,40px);margin-top:22px}
.split p{margin:0;font-size:.95rem;color:var(--mute)}
.split b{display:block;font:200 clamp(1.7rem,3.6vw,2.5rem)/1.15 var(--nu)}
.split>div{padding-top:10px}
.split .sa{border-top:2px solid var(--a)}.split .sc{border-top:2px solid var(--c)}
.split .sa b{color:var(--a-txt)}.split .sc b{color:var(--c-txt)}
.one{margin:20px 0 0;font-size:1.05rem}
.asm0{margin:8px 0 0;font-size:.9rem;color:var(--faint)}
.res details{margin-top:14px;border-top:1px solid var(--line)}
.res summary{cursor:pointer;padding:12px 0;min-height:44px;color:var(--mute);font-size:1rem}
.res table{width:100%;border-collapse:collapse;font-size:.95rem}
.res th{font-weight:400;color:var(--faint);text-align:left;font-size:.85rem;padding:4px 8px 6px 0;border-bottom:1px solid var(--line)}
.res td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.res .n{text-align:right;white-space:nowrap;font:300 1.02rem/1.5 var(--nu);padding-right:0}
.note{font-size:.88rem;color:var(--mute);margin:10px 0 0}
.sl{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3.4em;gap:10px;align-items:center;font-size:.92rem;min-height:40px}
.sl input{width:100%;accent-color:var(--pt)}.sl output{text-align:right;font:300 1rem/1 var(--nu)}
.reset{font:400 .88rem/1.2 var(--ko);border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;min-height:40px;margin-top:8px;cursor:pointer;color:var(--ink)}
.defn{border-top:1px solid var(--line);padding:13px 0}
.defn b{display:block;font-weight:500}.defn span{color:var(--mute);font-size:1rem}
.none{font:300 1.2rem/1.5 var(--ko);margin:0;color:var(--mute)}
.grpl{font-size:.88rem;color:var(--faint);margin:26px 0 4px}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--mute);font-size:.88rem}
footer p{margin:0 0 4px}footer a{color:var(--ink)}
/* 담당 설계사 연락 — 화면 아래에 늘 보임 */
.cbar{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:2px solid var(--a);box-shadow:0 -6px 18px rgba(0,0,0,.07);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px))}
.cbar .wrap{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px}
.cbar .ct{flex:1 1 220px;min-width:0}
.cbar .ct b{display:block;font-size:1.2rem;font-weight:700;line-height:1.35}
.cbar .ct span{display:block;font-size:.95rem;line-height:1.4;color:var(--mute)}
.cbar .cb{display:flex;gap:8px;flex:1 1 300px}
.cbar a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:12px;text-decoration:none}
.cbar .call{flex:1;background:var(--a);color:#fff;font:600 1.35rem/1 var(--nu);letter-spacing:.01em}
.cbar .call svg{width:22px;height:22px;flex:none}
.cbar .sms{flex:none;padding:0 18px;border:1.5px solid var(--a);color:var(--a-txt);background:var(--bg);font-size:1rem;font-weight:700}
/* 담당자 화면 */
body.staff{overflow:hidden}
.shell{display:grid;grid-template-columns:440px minmax(0,1fr);height:100vh;height:100dvh}
#staff{border-right:1px solid var(--line);overflow-y:auto;background:var(--wash);padding:24px 22px 0;font-size:.95rem;line-height:1.5}
#staff h2{margin:0;font:300 1.7rem/1.2 var(--ko);letter-spacing:-.02em}
#staff .hint{color:var(--mute);margin:8px 0 0;font-size:.88rem}
#staff fieldset{border:0;padding:0;margin:20px 0 0}
#staff legend{padding:0;font-weight:500;margin-bottom:8px}
.fld{display:block;margin-bottom:10px}
.fld>span{display:block;font-size:.85rem;color:var(--mute);margin-bottom:3px}
#staff input[type=text],#staff input[type=tel],#staff input[type=number]{width:100%;height:42px;border:1px solid #D9D8DD;border-radius:4px;background:#fff;padding:0 10px;font-size:1rem;color:var(--ink)}
#staff input:focus{outline:2px solid var(--pt);outline-offset:-1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg2{display:inline-flex;gap:4px}
.seg2 button{font:400 .92rem/1.2 var(--ko);border:1px solid #D9D8DD;background:#fff;color:var(--ink);border-radius:999px;padding:7px 16px;min-height:40px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chk{display:flex;gap:8px;align-items:center;min-height:40px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--pt);flex:none}
#staff details{border-top:1px solid var(--line);margin:0}
#staff details:last-of-type{border-bottom:1px solid var(--line)}
#staff summary{cursor:pointer;padding:12px 0;min-height:46px;font-weight:500;display:flex;gap:8px;align-items:center}
#staff summary small{color:var(--faint);font-weight:400;margin-left:auto}
#staff summary::-webkit-details-marker{display:none}
#staff summary::after{content:"+";font:200 1.4rem/1 var(--nu);color:var(--mute)}
#staff details[open]>summary::after{content:"\2212"}
.amt{display:grid;grid-template-columns:minmax(0,1fr) 84px 76px;gap:8px;align-items:center;margin-bottom:6px;font-size:.9rem}
.amt .h{display:flex;gap:4px;align-items:center;font-size:.76rem;color:var(--mute);cursor:pointer;line-height:1.2}
.amt .h input{width:15px;height:15px;accent-color:var(--pt);flex:none}
.amt input[type=number]{height:36px!important;text-align:right;font-size:.95rem!important;padding:0 8px!important}
.amthead{display:grid;grid-template-columns:minmax(0,1fr) 84px 76px;gap:8px;font-size:.74rem;color:var(--faint);margin-bottom:4px}
.amthead span:nth-child(2){text-align:right}
.limit{margin:18px 0 0;padding:12px 14px;border-left:2px solid var(--pt);background:#fff;font-size:.86rem;color:var(--mute)}
.limit b{color:var(--ink);font-weight:500}
.savebar{position:sticky;bottom:0;background:var(--wash);border-top:1px solid var(--line);margin:22px -22px 0;padding:10px 22px 14px}
#save{width:100%;height:50px;border:0;border-radius:4px;background:var(--ink);color:#fff;font-size:1.02rem;cursor:pointer}
#save:disabled{background:#C9C8CE;cursor:not-allowed}
#saveMsg{margin:6px 0 0;font-size:.82rem;color:var(--mute);min-height:1.2em}
.staff #view{overflow-y:auto;height:100%}
.vlabel{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);font-size:.82rem;color:var(--faint);padding:7px 20px}
.stabs{display:none}
@media (max-width:900px){
 body.staff{overflow:auto}
 .shell{display:block;height:auto}
 #staff{border-right:0;overflow:visible;padding-top:16px}
 .staff #view{height:auto;overflow:visible}
 .vlabel{display:none}
 .savebar{position:static}
 .stabs{display:grid;grid-template-columns:1fr 1fr;position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line)}
 .stabs button{height:48px;border:0;background:none;font-size:.98rem;color:var(--mute);cursor:pointer}
 .stabs button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--pt)}
 body[data-tab="in"] #view{display:none}
 body[data-tab="out"] #staff{display:none}
}
details.hit.cx>summary{list-style:none}
details.hit.cx>summary::-webkit-details-marker{display:none}
details.hit.cx[open]>.hitrow::after{content:"\2212"}
details.hit.cx[open]>.hitrow .am{display:none}
.cxt{width:100%;border-collapse:collapse;font-size:.95rem;margin-top:18px}
.cxt th{font-weight:400;color:var(--faint);text-align:left;font-size:.85rem;padding:4px 8px 6px 0;border-bottom:1px solid var(--line)}
.cxt td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line)}
.cxt .n{text-align:right;white-space:nowrap;padding-right:0}
.res .note{font-size:.9rem;color:var(--mute);margin:10px 0 0}
.hitrow .am.zero{font:300 1rem/1 var(--ko);color:var(--faint)}
.res .note{background:none;border:0;padding:0;border-radius:0;box-shadow:none}
.cxk{margin:0 0 6px;font-size:.84rem;color:var(--faint)}
.hitrow .am{white-space:nowrap}
.cxt small{font-size:.8rem;color:var(--mute);font-family:var(--ko)}
details.hit.cx .hitrow .am:not(.zero){font-size:1.2rem}
.stg{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.sh{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:1.02rem}
.sh b{font:300 1.35rem/1 var(--nu);color:var(--pt);white-space:nowrap}
.cxt td b{display:block;font-weight:400}
.why{display:block;font-size:.8rem;color:var(--faint);line-height:1.45;margin-top:2px}
.optw{margin-top:22px}
.stg2{border-top:1px solid var(--line)}
.stg2>summary{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;min-height:46px;cursor:pointer;list-style:none}
.stg2>summary::-webkit-details-marker{display:none}
.stg2>summary b{font:300 1.15rem/1 var(--nu);color:var(--pt);white-space:nowrap}
.stg2[open]>summary{color:var(--ink)}
#staff textarea{width:100%;min-height:90px;border:1px solid #D9D8DD;border-radius:4px;background:#fff;padding:8px 10px;font:400 .88rem/1.5 var(--ko);color:var(--ink);resize:vertical}
#drop{border:1.5px dashed #C9C8CE;border-radius:6px;background:#fff;padding:16px;text-align:center;color:var(--mute);font-size:.9rem;cursor:pointer;display:block}
#drop.on{border-color:var(--pt);color:var(--ink)}
#drop input{display:none}
.btn2{height:40px;border:1px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);padding:0 14px;font-size:.92rem;cursor:pointer;margin-top:8px}
.btn3{border:0;background:none;color:var(--mute);font-size:.82rem;text-decoration:underline;cursor:pointer;padding:6px 0}
#pmsg{margin:8px 0 0;font-size:.85rem;color:var(--ink);min-height:1.2em}
#prods{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
#prods button{font:400 .82rem/1.2 var(--ko);border:1px solid #D9D8DD;background:#fff;color:var(--ink);border-radius:999px;padding:6px 11px;min-height:34px;cursor:pointer}
#prods button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
#plist{max-height:300px;overflow-y:auto;margin-top:6px}
.prow{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 2px;font-size:.86rem;line-height:1.4;color:var(--ink);cursor:pointer}
.prow:hover{background:#fff}
.pp{display:inline-block;font-size:.72rem;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-right:6px}
.pk{float:right;font-size:.72rem;color:var(--faint);margin-left:8px}
.rrow{display:grid;grid-template-columns:62px minmax(0,1fr) 78px 30px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.84rem;line-height:1.35}
.rrow .kb{font-size:.7rem;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:2px 4px;text-align:center;background:#fff}
.rrow.off .kb{color:var(--faint)}.rrow.off .rn{color:var(--faint)}
.rrow.miss .rn{color:var(--pt)}.rrow .rn em{display:block;font-style:normal;font-size:.72rem}
.rrow input{height:34px!important;text-align:right;font-size:.92rem!important;padding:0 6px!important}
.rx{border:0;background:none;font:200 1.3rem/1 var(--nu);color:var(--mute);cursor:pointer;height:34px}
#rcount{font-size:.82rem;color:var(--mute);margin:0 0 6px}
#ver{font-size:.75rem;color:var(--faint);margin:4px 0 0}
.memo{margin:20px 0 0;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 14px}
.memo>summary{cursor:pointer;padding:12px 0;font-weight:500;list-style:none}
.memo>summary::-webkit-details-marker{display:none}
.memo>summary::after{content:"+";float:right;font:200 1.3rem/1 var(--nu);color:var(--mute)}
.memo[open]>summary::after{content:"\2212"}
.memo h4{margin:14px 0 4px;font-size:.88rem;font-weight:500}
.memo p,.memo li{font-size:.82rem;line-height:1.55;color:var(--ink)}
.memo p{margin:4px 0}.memo ul{margin:0;padding-left:18px}
.memo .mwarn{color:var(--pt);margin:0 0 6px}
.memo .msrc{color:var(--faint);font-size:.74rem}
.memo .mt{width:100%;border-collapse:collapse;font-size:.8rem}
.memo .mt td{border-top:1px solid var(--line);padding:4px 6px 4px 0;vertical-align:top}
.memo .mt td:first-child{width:28px;font-family:var(--nu)}
.memo:last-of-type{margin-bottom:4px}
.hp{margin-top:22px;border-top:2px solid var(--ink);padding-top:10px}
.hpt{margin:0 0 2px;font-size:1.02rem;font-weight:500}
.hpq{display:grid;gap:8px;margin:8px 0 14px}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hl{flex:0 0 60px;font-size:.82rem;color:var(--mute)}
.hrow button{font:400 .88rem/1.2 var(--ko);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer}
.hrow button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.hrow button:disabled{opacity:.35;cursor:default}
.hn{display:inline-flex;align-items:center;gap:5px;font-size:.88rem;color:var(--mute)}
.hn input{width:66px;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:right;padding:0 8px;font:400 1rem var(--nu);color:var(--ink)}
.hpr .sh span{font-size:.92rem;color:var(--mute)}
td.svc{font:400 .88rem/1.35 var(--ko);color:var(--ink);white-space:nowrap}
@media (max-width:420px){.hl{flex-basis:100%;margin-bottom:-2px}}
.stread{margin:2px 0 10px;font-size:.88rem;color:var(--mute);line-height:1.5}
.adds{display:flex;flex-direction:column;gap:6px}
.addo{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:10px 12px;min-height:46px;font:400 .9rem/1.35 var(--ko);cursor:pointer}
.addo b{font:300 1.05rem/1 var(--nu);color:var(--pt);white-space:nowrap}
.addo.on{border-color:var(--ink)}.addo.on b{font:400 .82rem/1 var(--ko);color:var(--mute)}
.stc>summary .nm{font-weight:500}
.stset{margin:14px 0 4px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg)}
.stset>summary{cursor:pointer;list-style:none;padding:11px 0;font-size:.9rem;color:var(--ink);min-height:44px;display:flex;align-items:center}
.stset>summary::-webkit-details-marker{display:none}
.stset>summary::after{content:"+";margin-left:auto;font:200 1.3rem/1 var(--nu);color:var(--mute)}
.stset[open]>summary::after{content:"\2212"}
.stset .hpq{margin-top:0}
#mklink{margin-right:8px}
#lout{width:100%;min-height:64px;margin-top:8px;font:400 .78rem/1.4 var(--ko);word-break:break-all;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);color:var(--ink)}
.savebar .lbase{margin-top:12px}
</style></head>
<body>

<div id="view">

<section class="find" aria-label="병명 검색"><div class="wrap">
<p class="who" id="who"></p>
<h1>어떤 병이 걱정되세요?</h1>
<p class="findsub">병명이나 수술명을 찾으면 받을 수 있는 보험금이 바로 나와요. ‘교통사고로 입원 9일 대퇴부 수술’처럼 상황을 써도 돼요.</p>
<div class="findbox"><label class="vh" for="find">병명 검색</label><input id="find" type="search" autocomplete="off" placeholder="병명·수술명·상황 검색" enterkeyhint="search"><button id="findx" type="button" aria-label="검색어 지우기" hidden="">×</button></div>
<div class="chips0" id="chips0"></div>
<div id="found" aria-live="polite"></div>

function hitCard(x,open){KEYS[x.t+'|'+x.n]=x;var res=compute(x),h=res?(x.c&&SCEN.isDem(x.c)?demMax(res):SCEN.headline(res)):0,am=x.t==='no'?'<span class="am zero">수술비 안 나와요</span>':(h>0?'<span class="am">'+f(h)+'만원</span>':'<span class="am zero">해당 없음</span>');
  if(PANELS[x.t])am=PANELS[x.t].am(x);
  else if(res&&!(h>0)&&!(x.c&&SCEN.isDem(x.c))){var mx=Math.max.apply(0,[0].concat(res.filter(function(s){return !s.main}).map(function(s){return s.sum})));if(mx>0)am='<span class="am">상황 따라 +'+f(mx)+'만원</span>'}
  if(x.t==='su'){var g=gradeOf(x.su);if(g)am='<span class="am">'+g+'종 · '+(h>0?fm(h):'0')+'</span>'}
  if(TXK&&res&&x.t==='dz'){var ts=res.filter(function(s){return TXK.indexOf(s.k)>-1&&s.sum>0})[0];if(ts&&ts.g==='again')res.forEach(function(s){if(TXK.indexOf(s.k)>-1&&s.sum>ts.sum)ts=s});am=ts?'<span class="am">'+(ts.g==='again'?esc(TXL)+' 최대':(TXS[ts.k]||''))+' +'+f(ts.sum)+'만원</span>':'<span class="am zero">해당 없음</span>'}
  return '<details class="hit cx"'+(open?' open':'')+' data-k="'+esc(x.t+'|'+x.n)+'"><summary class="hitrow"><span class="nm">'+esc(x.n)+'</span>'+am+'</summary><div class="res">'+(open?cardBody(x,res):'')+'</div></details>'}
function draw(){var raw=inp.value,q=norm(raw);q=FIX[q]||q;clr.hidden=!raw;$('#chips0').hidden=!!q;$('#prem0').hidden=!!q;if(q!==lastQ){openKey=null;lastQ=q}
  if(!q||q.length<2&&q!=='암'){box.innerHTML='';drawHead();TXK=null;return}
  var tx=txMode(q);TXK=null;TXL='';
  if(tx||/^암(진단|진단비|보험|종류)?$/.test(q)){var CN={};DATA.CA.forEach(function(c){CN[c[0]]=1});var ca=buildItems().filter(function(x){return x.t==='dz'&&CN[x.n]}),
      mine=ca.filter(function(x){return q.indexOf(norm(x.n))>-1}).sort(function(a,b){return b.n.length-a.n.length}).slice(0,1),
      list=mine.length?mine:(cfg.gender==='m'?CA_M:CA_F).map(function(n){return ca.filter(function(x){return x.n===n})[0]}).filter(Boolean);
    if(tx){TXK=tx[2];TXL=tx[1]}
    box.innerHTML=(mine.length?'':'<p class="grpl" style="margin:18px 0 4px">'+(tx?'어느 암인지 골라 주세요. 암 종류에 따라 '+TXL+' 금액이 달라질 수 있어요.':'어느 암인지 골라 주세요.')+'</p>')+list.map(function(x){return hitCard(x,!!mine.length)}).join('')+
      (mine.length?'':'<p class="note">목록에 없는 암은 '+(tx?'‘췌장암 '+(TXL==='항암치료'?'항암':TXL)+'’처럼 병명과 같이':'병명으로')+' 찾아 보세요.</p>');drawHead();return}
  var L=find(q),S=q.length>=4?SENT.parse(raw,buildItems()):null;if(S&&(S.subj&&S.subj.t==='no'||S.n<2&&(L.length||S.n<1)))S=null;
  if(S){if(q!==lastSitQ||!SIT){SIT=S;STATE.st=S;sitApply(S);lastSitQ=q}var X=sitItems(SIT);box.innerHTML=stCard()+(X.length?'<p class="grpl" style="margin:18px 0 4px">따로 보기</p>':'')+X.map(function(x){return hitCard(x,false)}).join('');drawHead();return}
  if(!L.length){box.innerHTML='<p class="none">‘'+esc(raw)+'’ 검색 결과가 없어요. 담당자에게 물어봐 주세요.</p>';drawHead();return}
  var ex=L.filter(function(x){return norm(x.n)===q})[0]||(L.length===1?L[0]:null);
  box.innerHTML=L.map(function(x){return hitCard(x,ex===x)}).join('');drawHead()}
function drawHead(){var nm=String(cfg.name||'').trim();$('#who').textContent=cfg._note||(nm?nm+' 님 보장 안내':'고객님 보장 안내');
  $('#prem0').textContent=cfg.prem?'월 보험료 '+cfg.prem:'';
  $('#chips0').innerHTML=(cfg.gender==='m'?POP_M:POP_F).map(function(c){return '<button type="button" data-q="'+c+'">'+c+'</button>'}).join('');
  var mg=String(cfg.mgr||'').trim(),dg=String(cfg.tel||'').replace(/[^\d+]/g,''),cb=$('#cbar');$('#mgr').hidden=true;if(!cb)return;cb.hidden=!(mg||dg);
  cb.innerHTML=(mg||dg)?'<div class="wrap"><div class="ct"><b>궁금한 건 편하게 연락 주세요</b><span>담당 설계사'+(mg?' '+esc(mg):'')+'</span></div>'+(dg?'<div class="cb"><a class="call" href="tel:'+esc(dg)+'" aria-label="담당 설계사에게 전화하기 '+esc(telF(dg))+'">'+TELI+'<span>'+esc(telF(dg))+'</span></a><a class="sms" href="sms:'+esc(dg)+'">문자</a></div>':'')+'</div>':''}
var TELI='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
function telF(d){if(/^01\d{9}$/.test(d))return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);if(/^01\d{8}$/.test(d))return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);if(/^02\d{7,8}$/.test(d))return '02-'+d.slice(2,-4)+'-'+d.slice(-4);if(/^0\d{9,10}$/.test(d))return d.slice(0,3)+'-'+d.slice(3,-4)+'-'+d.slice(-4);return d}

    if(fl==='days'){v=Math.round(v);if(v<1||v>365)return}if(fl==='icu'||fl==='visits'||fl==='daycare')v=Math.round(v);H[fl]=v;
    $$('.hp [data-hn="'+fl+'"]',box).forEach(function(o){if(o!==t)o.value=v});if(fl==='days')$$('.hp [data-h="days"]',box).forEach(function(b){b.setAttribute('aria-pressed',String(+b.dataset.v===v))});hpDraw(false)});
  inp.addEventListener('input',draw);clr.addEventListener('click',function(){inp.value='';draw();inp.focus()});

  box.addEventListener('toggle',function(e){var d=e.target;if(!d.matches||!d.matches('details.hit')||!d.open)return;var r=$('.res',d);if(r.innerHTML)return;var k=d.dataset.k,x=KEYS[k]||find(norm(inp.value)).filter(function(y){return y.t+'|'+y.n===k})[0];if(x)r.innerHTML=cardBody(x,compute(x))},true);
